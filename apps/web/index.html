<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172b4d" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>UNEEngine | Setup</title>
    <meta name="description" content="Metadata-driven CRM setup and builder workspace" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var spaPath = params.get('__spa');
        if (!spaPath) return;
        params.delete('__spa');
        var restored = spaPath;
        // Accept previously shared GitHub project URLs on the canonical custom domain.
        if (restored.indexOf('/metadrive/') === 0) restored = restored.slice('/metadrive'.length);
        if (!restored.startsWith('/') || restored.startsWith('//')) restored = '/';
        var remainingQuery = params.toString();
        if (remainingQuery) restored += (restored.indexOf('?') >= 0 ? '&' : '?') + remainingQuery;
        window.history.replaceState({}, '', restored);
      }());
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
