<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Une Solutions login</title>
</head>
<body>
  <p>Opening the Une Solutions login… <a href="/?__spa=%2Flogin">Continue to login</a>.</p>
  <script>
    (function () {
      // Keep the customer on the branded domain and preserve login query parameters.
      var route = '/login' + window.location.search + window.location.hash;
      window.location.replace('/?__spa=' + encodeURIComponent(route));
    }());
  </script>
</body>
</html>
