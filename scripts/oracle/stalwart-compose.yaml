services:
  stalwart:
    container_name: stalwart-setup
    image: stalwartlabs/stalwart@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
    restart: unless-stopped
    user: stalwart
    working_dir: /var/lib/stalwart
    command: ["--config", "/etc/stalwart/config.json"]
    environment:
      STALWART_HEALTHCHECK_URL: "${STALWART_HEALTHCHECK_URL:-}"
    volumes:
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    ports:
      - "0.0.0.0:25:25/tcp"
      - "0.0.0.0:587:587/tcp"
      - "0.0.0.0:993:993/tcp"
      - "127.0.0.1:8080:8080/tcp"
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsSk -H "X-Forwarded-For: 127.0.0.1" "$$STALWART_HEALTHCHECK_URL" || curl -fsS -H "X-Forwarded-For: 127.0.0.1" http://127.0.0.1:8080/healthz/live || exit 1'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  stalwart-etc:
    external: true
    name: stalwart-etc
  stalwart-data:
    external: true
    name: stalwart-data
