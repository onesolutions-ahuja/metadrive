name: Validate relational migration (staging only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/relational-projection.mjs'
      - 'apps/server/sql/relational-state-v1.sql'
      - 'apps/server/scripts/migrate-relational-state.mjs'
      - 'apps/server/test/relational-*.test.mjs'
      - 'apps/server/test/isolated-postgres-preload.mjs'
      - '.github/workflows/metadrive-relational-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile application (web and server)
        run: npm run build
      - name: Run existing backend tests in independently isolated PostgreSQL schemas
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          METADRIVE_TEST_ISOLATION: 'true'
          NODE_OPTIONS: '--import=${{ github.workspace }}/apps/server/test/isolated-postgres-preload.mjs'
        run: npm test --workspace apps/server
      - name: Verify projections and staging migration in real PostgreSQL
        run: node --test apps/server/test/relational-projection.test.mjs apps/server/test/relational-staging.integration.test.mjs
