name: Validate relational migration (staging only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/relational-projection.mjs'
      - 'apps/server/src/relational-runtime.mjs'
      - 'apps/server/src/relational-account-recovery.mjs'
      - 'apps/server/scripts/reset-relational-password.mjs'
      - 'apps/server/src/relational-runtime.d.mts'
      - 'apps/server/src/relational-tables.mjs'
      - 'apps/server/src/postgres-state.ts'
      - 'apps/server/src/index.ts'
      - 'apps/server/src/normalized-typed-records.mjs'
      - 'apps/server/scripts/prove-typed-records-on-restore.mjs'
      - 'apps/server/test/normalized-api.integration.test.mjs'
      - 'scripts/md06-records-browser-smoke.mjs'
      - 'scripts/md07-component-browser-smoke.mjs'
      - 'apps/server/sql/component-registry-v4.sql'
      - 'apps/server/test/component-registry-sql.integration.test.mjs'
      - 'apps/web/src/App.tsx'
      - 'apps/server/src/tenant-recovery-*.mjs'
      - 'apps/server/sql/tenant-recovery-control.sql'
      - 'apps/server/test/tenant-recovery-*.mjs'
      - 'apps/server/sql/relational-state-v1.sql'
      - 'apps/server/scripts/migrate-relational-state.mjs'
      - 'apps/server/scripts/migrate-relational-in-place.mjs'
      - 'apps/server/scripts/restore-relational-to-legacy.mjs'
      - 'apps/server/scripts/copy-runtime-assets.mjs'
      - 'apps/server/package.json'
      - 'apps/server/src/relational-copy.mjs'
      - 'apps/server/test/relational-*.test.mjs'
      - 'apps/server/test/isolated-postgres-preload.mjs'
      - '.github/workflows/metadrive-relational-validation.yml'
  push:
    branches: [migration/relational-staging-20261011, md06-record-integrity-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile application (web and server)
        run: npm run build
      - name: Verify compiled runtime modules
        run: |
          test -f apps/server/dist/index.js
          test -f apps/server/dist/relational-runtime.mjs
          test -f apps/server/dist/relational-projection.mjs
          test -f apps/server/dist/relational-tables.mjs
      - name: Smoke-test compiled server startup
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
          METADRIVE_DATA_PATH: ${{ runner.temp }}/relational-compiled-api-state.json
          METADRIVE_SCHEDULE_POLL_MS: '3600000'
          PORT: '38921'
        run: |
          node apps/server/dist/index.js > "${RUNNER_TEMP}/metadrive-compiled.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:38921/health >/dev/null; then
              echo "Compiled MetaDrive server passed startup and health check"
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              cat "${RUNNER_TEMP}/metadrive-compiled.log"
              exit 1
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/metadrive-compiled.log"
          exit 1
      - name: Smoke-test database maintenance freeze
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
          METADRIVE_MAINTENANCE_MODE: 'true'
          METADRIVE_DATA_PATH: ${{ runner.temp }}/maintenance-state.json
          METADRIVE_SCHEDULE_POLL_MS: '3600000'
          PORT: '38922'
        run: |
          node apps/server/dist/index.js > "${RUNNER_TEMP}/metadrive-maintenance.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:38922/health > "${RUNNER_TEMP}/maintenance-health.json"; then break; fi
            if ! kill -0 $pid 2>/dev/null; then cat "${RUNNER_TEMP}/metadrive-maintenance.log"; exit 1; fi
            sleep 1
          done
          node --input-type=module -e "import{readFileSync}from'node:fs'; const h=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/maintenance-health.json','utf8'));if(h.maintenance!==true)throw Error('Maintenance health indicator missing')"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' --data '{}' \
            http://127.0.0.1:38922/api/auth/login)
          test "$code" = 503 || { echo "Maintenance did not reject API writes: $code"; exit 1; }
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:38922/api/whatsapp/webhook)
          test "$code" = 503 || { echo "Maintenance did not reject webhook traffic: $code"; exit 1; }
          echo "Maintenance gate rejected API requests and preserved the health check"
      - name: Verify isolated tenant recovery control database and transaction policy
        run: node --test apps/server/test/tenant-recovery-postgres.integration.test.mjs
      - name: Verify projections and staging migration in real PostgreSQL
        env:
          METADRIVE_REL_VERIFY_WRITES: 'true'
        run: node --test --test-concurrency=1 apps/server/test/relational-projection.test.mjs apps/server/test/relational-staging.integration.test.mjs apps/server/test/relational-runtime.integration.test.mjs apps/server/test/relational-api.integration.test.mjs apps/server/test/relational-in-place.integration.test.mjs
      - name: Verify SQL-only component registry schema and tenant-owned dependencies
        run: node --test apps/server/test/component-registry-sql.integration.test.mjs
      - name: Verify typed SQL records, login, relationships and Flow API end to end
        env:
          METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: node --test --test-concurrency=1 apps/server/test/normalized-api.integration.test.mjs
      - name: Verify real Records UI in disposable Chromium test environment
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/md06-records-browser-smoke.mjs
          node scripts/md07-component-browser-smoke.mjs
      - name: Run existing backend tests in independently isolated PostgreSQL schemas
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          METADRIVE_TEST_ISOLATION: 'true'
          NODE_OPTIONS: '--import=${{ github.workspace }}/apps/server/test/isolated-postgres-preload.mjs'
        run: npm test --workspace apps/server
