name: Phase 3 shared UI and live registry acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase3-shared-ui-acceptance.yml'
      - 'scripts/phase3-live-registry-acceptance.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build all shared Phase 3 runtimes and verify metadata contracts
        run: npm run build
      - name: Test responsive layouts, typed component properties and sandbox policy
        run: npx tsx --test apps/web/test/pageComponentLayout.test.ts apps/web/test/componentProperties.test.ts apps/web/test/componentSandboxPolicy.test.ts
      - name: Install Chromium for real registered-component UI smoke test
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify registered component publishing, sandbox rendering and page builder in Chromium
        run: node scripts/md07-component-browser-smoke.mjs
      - name: Check live OneEngine component registry, properties, surfaces and RBAC
        env:
          METADRIVE_API_URL: https://metadrive.onrender.com
          METADRIVE_EXPECTED_TENANT_ID: unesolutions-dev
          METADRIVE_ADMIN_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_ADMIN_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/phase3-live-registry-acceptance.mjs
