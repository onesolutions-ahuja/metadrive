name: Stop isolated Oracle staging API

on:
  push:
    branches:
      - ops/oracle-stage-api-diagnostics-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop stage API to prevent cloned production jobs from executing
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
        run: |
          set -euo pipefail
          echo "STAGE_API_CLEANUP=BEGIN"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/oracle_diag"
          chmod 600 "$HOME/.ssh/oracle_diag"
          host="${ORACLE_SSH_HOST:-132.145.18.46}"
          ssh-keyscan -T 5 -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/oracle_diag" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "ubuntu@$host" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          sudo systemctl stop metadrive-stage-test.service || true
          sudo systemctl disable metadrive-stage-test.service || true
          state="$(systemctl is-active metadrive-stage-test.service || true)"
          echo "STAGE_API_SERVICE=$state"
          if [[ "$state" == "active" ]]; then
            echo "Stage API did not stop"
            exit 1
          fi
          REMOTE
