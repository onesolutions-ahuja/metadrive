name: Start Oracle production worker and close temporary SSH access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Activate production worker and remove temporary GitHub SSH allowlist
        shell: bash
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/oracle_activate"
          chmod 600 "$HOME/.ssh/oracle_activate"
          host="${ORACLE_SSH_HOST:-132.145.18.46}"
          ssh-keyscan -T 5 -H "$host" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/oracle_activate" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "ubuntu@$host" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          release=/opt/metadrive/releases/oracle-stage-d7ebd0734610a44f5aacdb49823699e52d1077cf
          test -f /etc/metadrive/production.env
          test -f "$release/apps/server/dist-system/system-support/job-worker-entrypoint.js"
          sudo tee /etc/systemd/system/metadrive-worker.service >/dev/null <<EOF
          [Unit]
          Description=MetaDrive production durable job worker
          After=network-online.target postgresql.service metadrive-api.service
          Wants=network-online.target
          Requires=postgresql.service
          ConditionPathExists=/etc/metadrive/production.env

          [Service]
          Type=simple
          User=metadrive
          Group=metadrive
          WorkingDirectory=$release
          EnvironmentFile=/etc/metadrive/production.env
          ExecStart=/usr/local/bin/node $release/apps/server/dist-system/system-support/job-worker-entrypoint.js
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=60
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now metadrive-worker.service
          sleep 2
          worker_state="$(systemctl is-active metadrive-worker.service || true)"
          api_state="$(systemctl is-active metadrive-api.service || true)"
          echo "PRODUCTION_API_SERVICE=$api_state"
          echo "PRODUCTION_WORKER_SERVICE=$worker_state"
          if [[ "$api_state" != "active" || "$worker_state" != "active" ]]; then
            sudo journalctl -u metadrive-api.service -n 40 --no-pager
            sudo journalctl -u metadrive-worker.service -n 60 --no-pager
            exit 1
          fi
          sudo systemctl stop metadrive-stage-test.service 2>/dev/null || true
          sudo systemctl disable metadrive-stage-test.service 2>/dev/null || true
          sudo systemctl stop metadrive-private-test.service 2>/dev/null || true
          sudo systemctl disable metadrive-private-test.service 2>/dev/null || true
          sudo iptables -D INPUT -m set --match-set metadrive_actions_v4 src -p tcp --dport 22 -j ACCEPT 2>/dev/null || true
          sudo ipset destroy metadrive_actions_v4 2>/dev/null || true
          echo "TEMPORARY_GITHUB_SSH_ALLOWLIST=REMOVED"
          echo "STAGING_SERVICES=STOPPED"
          REMOTE
          curl -fsS --max-time 10 https://api.unesolutions.co.uk/api/health
          echo
          echo "ORACLE_PRODUCTION_WORKER_AND_FIREWALL_CLEANUP=PASS"
