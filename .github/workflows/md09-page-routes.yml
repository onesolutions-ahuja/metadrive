name: MD-09 Page Routes E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/pageActionRouting.ts'
      - 'scripts/page-action-routing.test.mjs'
      - 'scripts/md09-page-routing-browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/md09-page-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-routes-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify metadata route resolver
        run: npm run test:page-routing
      - name: Build frontend and backend
        run: npm run build
      - name: Install isolated Chromium test tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Exercise Page Builder and published App Page navigation
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: node scripts/md09-page-routing-browser-smoke.mjs
