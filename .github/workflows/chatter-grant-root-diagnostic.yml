name: Chatter grants production diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/chatter-grant-root-diagnostic.mjs
      - .github/workflows/chatter-grant-root-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit tenant grant mapping without secrets
        env:
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/chatter-grant-root-diagnostic.mjs
