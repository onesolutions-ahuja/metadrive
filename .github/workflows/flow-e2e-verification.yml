name: Flow scheduler and subflow isolated end-to-end proof
on:
  push:
    branches: [validation/flow-e2e-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flow-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: ''
      NODE_ENV: test
      METADRIVE_TEST_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify real PostgreSQL scheduler lease and crash recovery
        run: npx tsx --test apps/server/test/scheduler-postgres-lease.integration.test.ts
      - name: Verify scheduled record path executes via durable runtime
        run: npx tsx --test apps/server/test/flow-async-path.test.ts
      - name: Verify metadata Flow orchestration API and durable continuation
        run: npx tsx --test apps/server/test/flow-orchestration.test.ts
