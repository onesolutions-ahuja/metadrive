name: MD-09 Completion - Dashboard, Layers, RBAC
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/EmbeddedDashboard.tsx'
      - 'apps/web/src/pageDependencies.ts'
      - 'apps/web/src/componentCatalog.ts'
      - 'apps/web/src/styles.css'
      - 'apps/server/src/index.ts'
      - 'scripts/md09-page-completion*'
      - '.github/workflows/md09-completion.yml'
  workflow_dispatch:
# Superseded PR commits should not consume runner minutes; distinct workflows
# retain their own required checks. Main branch validations are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Native dashboard aggregate and metadata bindings
        run: npx tsx --test scripts/md09-page-completion.test.mjs
      - name: Full build and foundation regression
        run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Page Builder and deployed dashboard browser regression
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: node scripts/md09-page-completion-browser-smoke.mjs
