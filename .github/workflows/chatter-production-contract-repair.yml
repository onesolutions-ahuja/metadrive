name: Chatter production contract repair
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/chatter-production-contract-repair.mjs
      - .github/workflows/chatter-production-contract-repair.yml
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish authorized Chatter metadata
        env:
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/chatter-production-contract-repair.mjs
