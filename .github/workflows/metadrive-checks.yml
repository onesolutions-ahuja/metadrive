name: MetaDrive current platform checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: current-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test current platform behaviour
        run: npm run test:unit
      - name: Compile the web and server once
        run: npm run build
      - name: Verify lazy loading
        run: node apps/web/src/shared/verify-lazy-bundle.mjs apps/web/dist
      - name: Verify published Pages bundle
        run: node scripts/verify-pages-artifacts.mjs
      - name: Verify server output
        run: test -f apps/server/dist/index.js
