name: Validate MetaDrive deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix-missing-connector-test-module]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web and server
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://oneengine-6gas.onrender.com/api
        run: npm run build
