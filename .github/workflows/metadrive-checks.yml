name: Validate MetaDrive deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix-render-server-tsc-emit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web and server
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://oneengine-6gas.onrender.com/api
        run: npm run build
      - name: Verify emitted server entrypoint
        run: test -f apps/server/dist/index.js
      - name: Test connector executor
        run: npm exec --workspace apps/server -- tsx --test test/connector-test.test.ts
