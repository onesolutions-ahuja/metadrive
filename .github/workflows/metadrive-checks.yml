name: Validate MetaDrive deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature-aiven-persistent-state]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate registered kiosk JSX compilation
        run: node --test scripts/kiosk-phase4-compile.test.mjs
      - name: Verify safe retired-package metadata cleanup
        run: node --test apps/server/test/package-retirement-preservation.test.mjs
      - name: Build web and server
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
          VITE_API_BASE_URL: https://metadrive.onrender.com/api
        run: npm run build
      - name: Audit production lazy-loading bundles
        run: node apps/web/src/shared/verify-lazy-bundle.mjs apps/web/dist
      - name: Validate Pages UI navigation, branding and layout artifact
        run: node scripts/verify-pages-release.mjs
      - name: Test bounded session restoration and auth lock cancellation
        run: node --test scripts/session-restore-guard.test.mjs
      - name: Verify emitted server entrypoint
        run: test -f apps/server/dist/index.js
      - name: Test server workflows and automation policy
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: npm run test --workspace apps/server
