name: Validate MetaDrive deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature-aiven-persistent-state, security/md-01e-api-log-isolation-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify kiosk metadata and compilation contract
        run: node apps/server/scripts/verify-kiosk-contract.mjs
      - name: Verify Till metadata and component compilation contract
        run: node apps/server/scripts/verify-till-contract.mjs
      - name: Build web and server
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://metadrive.onrender.com/api
        run: npm run build
      - name: Validate Pages UI navigation, branding and layout artifact
        run: node scripts/verify-pages-release.mjs
      - name: Verify emitted server entrypoint
        run: test -f apps/server/dist/index.js
      - name: Test server workflows and automation policy
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: npm run test --workspace apps/server
