name: Chatter Flow contract repair
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/chatter-flow-contract-repair.mjs
      - .github/workflows/chatter-flow-contract-repair.yml
permissions:
  contents: read
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate packaged and runtime Chatter contracts
        run: node --test scripts/chatter-flow-contract.test.mjs
      - name: Authorised tenant Flow resource repair and verification
        env:
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/chatter-flow-contract-repair.mjs
