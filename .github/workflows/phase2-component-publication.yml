name: Phase 2 - authorised live component publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-component-publication.yml'
      - 'scripts/phase2-publish-components.mjs'
      - 'apps/server/src/modules/metadata/phase2-replacement-definitions.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2-component-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate component source definitions
        run: node --test apps/server/test/phase2-replacement-definitions.test.mjs apps/server/test/phase2-replacement-runtime.test.mjs
      - name: Publish through OneEngine secured API and verify
        env:
          METADRIVE_API_URL: https://metadrive.onrender.com
          METADRIVE_EXPECTED_TENANT_ID: unesolutions-dev
          METADRIVE_ADMIN_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_ADMIN_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
          METADRIVE_PHASE2_PUBLISH_APPROVED: 'true'
        run: node scripts/phase2-publish-components.mjs
