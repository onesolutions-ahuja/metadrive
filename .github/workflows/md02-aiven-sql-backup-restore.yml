name: SQL-only Aiven encrypted backup and restore proof

on:
  workflow_dispatch:
    inputs:
      migrate_shared_commerce:
        description: 'Migrate shared category/modifier Object fields and repair previously removed SQL Object metadata'
        type: boolean
        required: true
        default: false
      commerce_tenant_id:
        description: 'Exact tenant ID for explicit commerce migration (not required for backup-only)'
        type: string
        required: false
        default: ''
      confirm_backend_offline:
        description: 'Confirm the API and background writers are stopped for a tenant SQL migration'
        type: boolean
        required: true
        default: false
      cleanup_verified_duplicates:
        description: 'After successful independent restore, remove only two proven duplicate backup copies'
        type: boolean
        required: true
        default: false
      cleanup_user_duplicates:
        description: 'After verified new backend deployment, retire only two redundant User representations'
        type: boolean
        required: true
        default: false
      cleanup_legacy_staging:
        description: 'Remove 11 obsolete relational-stage tables; preserve metadrive_rel_tenants and all live metadata'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/md02-aiven-sql-backup-restore.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: metadrive-sql-only-backup-restore
  cancel-in-progress: false

jobs:
  verify-backup:
    if: github.repository == 'onesolutions-ahuja/metadrive'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TARGET_DB: metadrive_sql_20261012
      ONE_TIME_RETIRE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[retire-objects:2026-10-17]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare limited-lifetime Aiven connection for read-only backup
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          if(!process.env.DATABASE_URL) throw Error('Aiven database secret missing');
          const u=new URL(process.env.DATABASE_URL);
          if(!['postgres:','postgresql:'].includes(u.protocol)
             ||!u.hostname.endsWith('.aivencloud.com')
             ||u.searchParams.get('sslmode')!=='require'
             ||u.pathname!=='/defaultdb') throw Error('Unexpected Aiven source connection');
          const env={PGHOST:u.hostname,PGPORT:u.port||'5432',
            PGUSER:decodeURIComponent(u.username),PGPASSWORD:decodeURIComponent(u.password),
            PGDATABASE:process.env.TARGET_DB,PGSSLMODE:'require'};
          if(Object.values(env).some(v=>!v||/[\r\n]/.test(v))) throw Error('Invalid PostgreSQL environment');
          writeFileSync(process.env.RUNNER_TEMP+'/sql-target.env',
            Object.entries(env).map(([k,v])=>k+'='+v).join('\n')+'\n',
            {flag:'wx',mode:0o600});
          NODE
      - name: Read-only consistent snapshot of SQL-only Aiven target
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/sql-target.env" \
            -v "$RUNNER_TEMP:/work" --entrypoint pg_dump postgres:18 \
            --format=custom --no-owner --no-acl --file=/work/sql-target.dump
          test -s "$RUNNER_TEMP/sql-target.dump"
      - name: Independently restore SQL-only snapshot on isolated PostgreSQL 18
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            --entrypoint createdb postgres:18 -h 127.0.0.1 -U postgres metadrive_sql_proof
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "$RUNNER_TEMP:/work" --entrypoint pg_restore postgres:18 \
            -h 127.0.0.1 -U postgres -d metadrive_sql_proof \
            --no-owner --no-acl --exit-on-error /work/sql-target.dump
      - name: Verify restored graph checksum, typed records and archive without writes
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_sql_proof
          PGSSLMODE: disable
          METADRIVE_MIGRATION_REPAIR_MODE: ${{ inputs.migrate_shared_commerce == true || env.ONE_TIME_RETIRE == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readNormalizedState} from './apps/server/src/normalized-state-runtime.mjs';
          import {verifyTypedRecords} from './apps/server/src/normalized-typed-records.mjs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:false,max:1});
          try {
            const c=await pool.query("SELECT count(*)::int AS n FROM information_schema.columns WHERE table_schema NOT IN ('pg_catalog','information_schema') AND data_type IN ('json','jsonb')");
            if(c.rows[0]?.n!==0) throw Error('Restored database contains JSON/JSONB');
            const repairMode=process.env.METADRIVE_MIGRATION_REPAIR_MODE==='true';
            const proof=await readNormalizedState(pool,repairMode?null:verifyTypedRecords);
            if(repairMode){
              const missing=await pool.query("SELECT o.api_name,count(p.record_id)::int AS presence FROM md_v2_object_registry o LEFT JOIN md_v2_field_presence p ON p.object_id=o.object_id WHERE o.active=true AND to_regclass('public.'||o.physical_table) IS NULL GROUP BY o.api_name");
              const expected=new Set(['Campaign','Global_Settings__c','KioskSettings__c','OrderLineModifier__c','Tenant__c','TillSession__c','User']);
              if(![0,expected.size].includes(missing.rows.length)||missing.rows.some(r=>!expected.has(r.api_name)||r.presence!==0))
                throw Error('Unexpected missing SQL tables or nonempty typed business values');
            }
            if(proof.version<1||!Object.keys(proof.state.tenants??{}).length)
              throw Error('Restored tenant state missing');
            const a=await pool.query('SELECT count(*)::int AS n FROM md_v4_archive_rows');
            if(a.rows[0]?.n<1) throw Error('Archive rows missing');
            console.log('PASS: independently restored SQL-only revision, tenant state, typed records and migration archive');
          } finally {await pool.end();}
          NODE
      - name: Encrypt, decrypt and checksum-test rollback snapshot
        env:
          METADRIVE_BACKUP_ENCRYPTION_KEY: ${{ secrets.METADRIVE_BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$METADRIVE_BACKUP_ENCRYPTION_KEY" || exit 1
          node apps/server/scripts/secure-relational-backup.mjs encrypt \
            "$RUNNER_TEMP/sql-target.dump" "$RUNNER_TEMP/sql-target.enc"
          node apps/server/scripts/secure-relational-backup.mjs decrypt \
            "$RUNNER_TEMP/sql-target.enc" "$RUNNER_TEMP/sql-target.verified"
          cmp "$RUNNER_TEMP/sql-target.dump" "$RUNNER_TEMP/sql-target.verified"
      - name: Generate proof from independently restored encrypted SQL backup
        if: (github.event_name == 'workflow_dispatch' && (inputs.cleanup_verified_duplicates == true || inputs.cleanup_user_duplicates == true || inputs.cleanup_legacy_staging == true || inputs.migrate_shared_commerce == true) || env.ONE_TIME_RETIRE == 'true') && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_sql_proof
          PGSSLMODE: disable
          METADRIVE_MIGRATION_REPAIR_MODE: ${{ inputs.migrate_shared_commerce == true || env.ONE_TIME_RETIRE == 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import pg from 'pg';
          import {readNormalizedState} from './apps/server/src/normalized-state-runtime.mjs';
          import {verifyTypedRecords} from './apps/server/src/normalized-typed-records.mjs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:false,max:1});
          try {
            const restored=await readNormalizedState(pool,
              process.env.METADRIVE_MIGRATION_REPAIR_MODE==='true'?null:verifyTypedRecords);
            if(restored.version<1)throw Error('Restored SQL revision not valid');
            const encrypted=readFileSync(process.env.RUNNER_TEMP+'/sql-target.enc');
            const decrypted=readFileSync(process.env.RUNNER_TEMP+'/sql-target.verified');
            if(!encrypted.length||!decrypted.length)throw Error('Encrypted backup proof incomplete');
            const proof={
              database:'metadrive_sql_20261012',
              revision:restored.version,
              stateDigest:restored.digest,
              restoredDatabaseVerified:true,
              encryptedBackupSha256:createHash('sha256').update(encrypted).digest('hex'),
              verifiedAt:new Date().toISOString()
            };
            writeFileSync(process.env.RUNNER_TEMP+'/sql-cleanup-restore-proof.json',JSON.stringify(proof),{mode:0o600,flag:'wx'});
            console.log('PASS: independently restored current SQL snapshot and encrypted backup proof');
          } finally {await pool.end();}
          NODE
      - name: Preflight guarded commerce retirement
        if: ((github.event_name == 'workflow_dispatch' && inputs.migrate_shared_commerce == true) || env.ONE_TIME_RETIRE == 'true') && github.ref == 'refs/heads/main'
        env:
          COMMERCE_TENANT: ${{ env.ONE_TIME_RETIRE == 'true' && 'unesolutions-dev' || inputs.commerce_tenant_id }}
          API_OFFLINE: ${{ inputs.confirm_backend_offline }}
          ALSO_BACKUPS: ${{ inputs.cleanup_verified_duplicates || false }}
          ALSO_USERS: ${{ inputs.cleanup_user_duplicates || false }}
          ALSO_STAGING: ${{ inputs.cleanup_legacy_staging || false }}
        run: |
          test -n "$COMMERCE_TENANT"
          if [ "$ONE_TIME_RETIRE" != 'true' ]; then test "$API_OFFLINE" = 'true'; fi
          test "$ALSO_BACKUPS" = 'false'
          test "$ALSO_USERS" = 'false'
          test "$ALSO_STAGING" = 'false'
      - name: Prove commerce migration on independent restored SQL database
        if: ((github.event_name == 'workflow_dispatch' && inputs.migrate_shared_commerce == true) || env.ONE_TIME_RETIRE == 'true') && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_sql_proof
          PGSSLMODE: disable
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_EXPECTED_TENANT_ID: ${{ env.ONE_TIME_RETIRE == 'true' && 'unesolutions-dev' || inputs.commerce_tenant_id }}
          METADRIVE_ISOLATED_SQL_RESTORE: 'true'
        run: |
          if [ "$ONE_TIME_RETIRE" = 'true' ]; then
            node apps/server/scripts/migrate-retired-commerce-typed-sql.mjs --product-fields-only --apply
          else
            node apps/server/scripts/migrate-retired-commerce-typed-sql.mjs --apply
          fi
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readNormalizedState} from './apps/server/src/normalized-state-runtime.mjs';
          import {verifyTypedRecords} from './apps/server/src/normalized-typed-records.mjs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:false,max:1});
          try {
            const verified=await readNormalizedState(pool,verifyTypedRecords);
            if(verified.version<2)throw Error('Commerce SQL restore migration revision absent');
            // The runtimeRecordSchema requires both timestamps on every row.
            // Prevent a SQL-valid migration from crashing app hydration.
            for(const [tenantId,tenant] of Object.entries(verified.state.tenants??{}))
              for(const [object,rows] of Object.entries(tenant.records??{}))
                for(const row of rows)
                  for(const field of ['CreatedDate','LastModifiedDate'])
                    if(typeof row[field]!=='string'||!Number.isFinite(Date.parse(row[field])))
                      throw Error('Hydration would fail: invalid '+field+' in '+tenantId+'/'+object);
            for(const tenant of Object.values(verified.state.tenants??{}))
              for(const object of tenant.objects??[]){
                const names=new Set();
                for(const field of object.fields??[]){
                  const key=field.apiName.toLowerCase();
                  if(names.has(key))throw Error('Restored SQL metadata has case-colliding fields on '+object.apiName);
                  names.add(key);
                }
              }
            console.log('PASS: commerce migration verified against independently restored typed SQL');
          } finally {await pool.end();}
          NODE
      - name: Apply independently proven commerce migration to offline live SQL
        if: ((github.event_name == 'workflow_dispatch' && inputs.migrate_shared_commerce == true) || env.ONE_TIME_RETIRE == 'true') && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_EXPECTED_TENANT_ID: ${{ env.ONE_TIME_RETIRE == 'true' && 'unesolutions-dev' || inputs.commerce_tenant_id }}
          METADRIVE_COMMERCE_MIGRATION_APPROVED: 'true'
          METADRIVE_BACKEND_MAINTENANCE_CONFIRMED: ${{ inputs.confirm_backend_offline }}
          METADRIVE_ONLINE_CAS_MIGRATION_APPROVED: ${{ env.ONE_TIME_RETIRE == 'true' }}
          # Aiven's project-private CA is not yet installed on the runner;
          # match the existing PostgreSQL sslmode=require transport until CA is configured.
          METADRIVE_DB_ALLOW_SELF_SIGNED_CERT: 'true'
          METADRIVE_SQL_CLEANUP_PROOF_FILE: ${{ runner.temp }}/sql-cleanup-restore-proof.json
        run: |
          if [ "$ONE_TIME_RETIRE" = 'true' ]; then
            node apps/server/scripts/migrate-retired-commerce-typed-sql.mjs --product-fields-only --apply
          else
            node apps/server/scripts/migrate-retired-commerce-typed-sql.mjs --apply
          fi
      - name: Verify live typed SQL integrity after commerce migration
        if: ((github.event_name == 'workflow_dispatch' && inputs.migrate_shared_commerce == true) || env.ONE_TIME_RETIRE == 'true') && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_EXPECTED_TENANT_ID: ${{ env.ONE_TIME_RETIRE == 'true' && 'unesolutions-dev' || inputs.commerce_tenant_id }}
          METADRIVE_DB_ALLOW_SELF_SIGNED_CERT: 'true'
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readNormalizedState} from './apps/server/src/normalized-state-runtime.mjs';
          import {verifyTypedRecords} from './apps/server/src/normalized-typed-records.mjs';
          const u=new URL(process.env.DATABASE_URL);
          u.pathname='/'+process.env.METADRIVE_SQL_TARGET_DB;
          for(const key of ['sslmode','sslcert','sslkey','sslrootcert'])u.searchParams.delete(key);
          const pool=new pg.Pool({connectionString:u.toString(),ssl:{rejectUnauthorized:process.env.METADRIVE_DB_ALLOW_SELF_SIGNED_CERT!=='true'},max:1});
          try{
            const state=await readNormalizedState(pool,verifyTypedRecords);
            if(!state.state.tenants?.[process.env.METADRIVE_EXPECTED_TENANT_ID])
              throw Error('Tenant not found after SQL commerce migration');
            for(const [tenantId,tenant] of Object.entries(state.state.tenants??{}))
              for(const [object,rows] of Object.entries(tenant.records??{}))
                for(const row of rows)
                  for(const field of ['CreatedDate','LastModifiedDate'])
                    if(typeof row[field]!=='string'||!Number.isFinite(Date.parse(row[field])))
                      throw Error('Live runtime record hydration invalid: '+tenantId+'/'+object+'/'+field);
            for(const tenant of Object.values(state.state.tenants??{}))
              for(const object of tenant.objects??[]){
                const names=new Set();
                for(const field of object.fields??[]){
                  const key=field.apiName.toLowerCase();
                  if(names.has(key))throw Error('Live SQL metadata has case-colliding fields on '+object.apiName);
                  names.add(key);
                }
              }
            console.log('PASS: live typed SQL normalized state, record timestamps and registry verified');
          } finally {await pool.end();}
          NODE
      - name: Remove identical unused historical backup copies only
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_verified_duplicates == true && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_SQL_CLEANUP_PROOF_FILE: ${{ runner.temp }}/sql-cleanup-restore-proof.json
        run: |
          node apps/server/scripts/remove-verified-sql-duplicates.mjs --apply
      - name: Retire duplicated User SQL representations after verified backend deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_user_duplicates == true && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_SQL_CLEANUP_PROOF_FILE: ${{ runner.temp }}/sql-cleanup-restore-proof.json
          METADRIVE_CLEANUP_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          node apps/server/scripts/remove-verified-sql-duplicates.mjs --user-duplicates --apply
      - name: Retire obsolete relational staging tables without touching tenant anchor
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_legacy_staging == true && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
          METADRIVE_SQL_TARGET_DB: metadrive_sql_20261012
          METADRIVE_SQL_CLEANUP_PROOF_FILE: ${{ runner.temp }}/sql-cleanup-restore-proof.json
          METADRIVE_CLEANUP_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: |
          node apps/server/scripts/remove-verified-sql-duplicates.mjs --retire-legacy-staging --apply
      - name: Erase short-lived cleanup proof
        if: always()
        run: rm -f "$RUNNER_TEMP/sql-cleanup-restore-proof.json"
      - name: Retain encrypted verified SQL-only snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadrive-sql-only-verified-encrypted-backup
          path: ${{ runner.temp }}/sql-target.enc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Erase plaintext snapshot and temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sql-target.env" "$RUNNER_TEMP/sql-target.dump" \
            "$RUNNER_TEMP/sql-target.verified" "$RUNNER_TEMP/sql-target.enc"
