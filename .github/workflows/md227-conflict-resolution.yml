name: MD227 Resolve and Validate Merge
on:
  push:
    branches:
      - feature/modern-canvas-phase2-20261013
    paths:
      - .github/workflows/md227-conflict-resolution.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/modern-canvas-phase2-20261013
          fetch-depth: 0
      - name: Merge latest main without losing unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MetaDrive Merge CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff -s ort -X ours origin/main
          test -z "$(git ls-files -u)"
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Validate canvas geometry and metadata
        run: npm run test:canvas
      - name: Run full build gate
        run: npm run build
      - name: Commit and push verified conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Merge main into Phase 2 Till canvas after full validation"
          git push origin HEAD:feature/modern-canvas-phase2-20261013
