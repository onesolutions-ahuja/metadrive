name: Apply and validate password OTP migration
on:
  push:
    branches: [feature/password-reset-email-otp-20261013]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply OTP patch to frontend and backend
        run: node scripts/apply-password-otp.mjs
      - name: Compile frontend and server
        run: npm run build --workspace apps/server
      - name: Run password recovery security smoke test
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: npx tsx --test apps/server/test/module4-password-recovery.smoke.test.ts
      - name: Commit validated OTP implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/index.ts apps/web/src/App.tsx apps/server/test/module4-password-recovery.smoke.test.ts
          git rm scripts/apply-password-otp.mjs .github/workflows/apply-password-otp.yml
          git commit -m "feat(auth): use secure six-digit email OTP for password recovery"
          git push origin HEAD:feature/password-reset-email-otp-20261013
