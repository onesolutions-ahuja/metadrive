name: MD-09 Page Creation Wizard

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'scripts/md09-create-page-browser-smoke.mjs'
      - '.github/workflows/md09-page-creation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Full production build and foundation tests
        run: npm run build
      - name: Install disposable Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Create Page, bind App, save and reopen
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: node scripts/md09-create-page-browser-smoke.mjs
