name: Dependency cleanup (one-time)

on:
  push:
    branches: [chore/dependency-audit-cleanup-20261016]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[dependency-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Align Express 4 type definitions and update lockfile
        run: |
          npm install --save-dev --workspace apps/server '@types/express@^4.17.25'
          npm dedupe
          npm ci
      - name: Validate current project checks
        run: |
          POLICY_BASE_SHA="$(git rev-parse HEAD^)" POLICY_HEAD_SHA="$(git rev-parse HEAD)" npm run check
      - name: Commit only validated manifest and lockfile changes
        run: |
          git add apps/server/package.json apps/web/package.json package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No package changes needed'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: align Express types and deduplicate npm lockfile [dependency-cleanup]'
          git push origin HEAD:chore/dependency-audit-cleanup-20261016
