name: Integrate protected recovery Flow Builder
on:
  push:
    branches: [feature/tenant-recovery-flow-platform-20261013]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply metadata Flow Builder integration
        run: |
          node scripts/apply-protected-recovery-flow.mjs
          node scripts/apply-protected-recovery-builder.mjs
      - name: Build frontend and backend
        run: npm run build --workspace apps/server
      - name: Test protected flow and OTP/link recovery security
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: npx tsx --test apps/server/test/recovery-flow.test.ts apps/server/test/recovery-policy.test.ts apps/server/test/module4-password-recovery.smoke.test.ts
      - name: Commit compiled and tested integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/index.ts apps/web/src/FlowBuilder.tsx
          git rm scripts/apply-protected-recovery-flow.mjs scripts/apply-protected-recovery-builder.mjs .github/workflows/integrate-protected-recovery.yml
          git commit -m "feat(recovery): publish restricted system recovery Flow and editable delivery actions"
          git push origin HEAD:feature/tenant-recovery-flow-platform-20261013
