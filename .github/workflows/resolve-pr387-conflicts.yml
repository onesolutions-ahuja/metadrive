name: Resolve PR 387 main conflicts
on:
  push:
    branches:
      - fix/chatter-fail-closed-controls-20261014
    paths:
      - .github/workflows/resolve-pr387-conflicts.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatter-fail-closed-controls-20261014
          fetch-depth: 0
          persist-credentials: true
      - name: Merge current main into PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit -X ours origin/main
          test -z "$(git ls-files -u)"
          git push origin HEAD:fix/chatter-fail-closed-controls-20261014
      - name: Confirm result
        run: |
          git status --short
          git log -1 --format='%h %s'
