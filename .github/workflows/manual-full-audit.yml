name: MetaDrive full UI-UX audit (manual only)

on:
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: "Optional earlier full-audit run ID for visual-regression comparisons"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: metadrive-ui-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Authenticated read-only UI/UX audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check audit syntax and required test secrets
        env:
          AUDIT_TEST_EMAIL: \${{ secrets.METADRIVE_TEST_EMAIL }}
          AUDIT_TEST_PASSWORD: \${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: |
          node --check scripts/manual-full-audit.mjs
          if [ -z "$AUDIT_TEST_EMAIL" ] || [ -z "$AUDIT_TEST_PASSWORD" ]; then
            echo "::error::Set METADRIVE_TEST_EMAIL and METADRIVE_TEST_PASSWORD in Actions repository secrets."
            exit 1
          fi
      - run: npm ci
      - name: Install temporary audit dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0 @axe-core/playwright@4.11.0 pngjs@7.0.0 pixelmatch@6.0.0
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Load approved prior screenshots if requested
        if: \${{ inputs.baseline_run_id != '' }}
        env:
          GH_TOKEN: \${{ github.token }}
          BASELINE_RUN: \${{ inputs.baseline_run_id }}
        run: |
          if ! [[ "$BASELINE_RUN" =~ ^[0-9]+$ ]]; then
            echo "::error::Baseline run ID must be numeric."
            exit 1
          fi
          mkdir -p audit-baselines
          gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" -n metadrive-full-audit -D audit-baselines
      - name: Audit live UI (read-only)
        env:
          METADRIVE_BASE_URL: https://onesolutions-ahuja.github.io/metadrive/
          METADRIVE_TEST_EMAIL: \${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: \${{ secrets.METADRIVE_TEST_PASSWORD }}
          METADRIVE_AUDIT_OUTPUT: audit-results
          METADRIVE_BASELINE_DIR: \${{ inputs.baseline_run_id != '' && 'audit-baselines' || '' }}
        run: node scripts/manual-full-audit.mjs
      - name: Lighthouse login page (mobile and desktop)
        if: always()
        run: |
          mkdir -p audit-results/lighthouse
          npx --yes lighthouse@12 https://onesolutions-ahuja.github.io/metadrive/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=audit-results/lighthouse/mobile.json --quiet || true
          npx --yes lighthouse@12 https://onesolutions-ahuja.github.io/metadrive/ --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=audit-results/lighthouse/desktop.json --quiet || true
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f audit-results/summary.md ]; then
            cat audit-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The audit did not produce a report. Inspect the previous step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload diagnostic evidence (test data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadrive-full-audit
          path: audit-results/
          if-no-files-found: warn
          retention-days: 3
