name: Phase 4 Kiosk - Install editable Pages and Flows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kiosk-phase4-live-install.yml'
      - 'scripts/kiosk-phase4-components.mjs'
      - 'scripts/kiosk-phase4-flows.mjs'
      - 'scripts/kiosk-phase4-pages.mjs'
      - 'scripts/install-kiosk-phase4.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: kiosk-phase4-live-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pages, actions and Flow contracts
        id: contracts
        run: node --test scripts/kiosk-phase4.test.mjs scripts/kiosk-fullscreen.test.mjs scripts/kiosk-oneengine-rbac.test.mjs scripts/kiosk-reference-screen.test.mjs
      - name: Check authorised endpoint and installer credentials
        id: credentials
        env:
          ADMIN_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo '::error::Missing MetaDrive admin GitHub Actions secrets.'
            exit 1
          fi
          curl --fail --retry 3 --retry-delay 5 --max-time 30 https://metadrive-production.up.railway.app/health >/dev/null
      - name: Install and verify reusable kiosk Pages, Flows, components and RBAC
        id: install
        shell: bash
        env:
          METADRIVE_API_URL: https://metadrive-production.up.railway.app
          METADRIVE_EXPECTED_TENANT_ID: unesolutions-dev
          METADRIVE_ADMIN_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_ADMIN_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
          METADRIVE_PHASE4_INSTALL_APPROVED: 'true'
        run: |
          set -o pipefail
          node scripts/install-kiosk-phase4.mjs 2>&1 | tee phase4-result.log
      - name: Publish real installation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION='Phase 4 Pages, active Flows, editable Components and RBAC verified'
          else
            STATE=failure
            DESCRIPTION="$(tail -n 1 phase4-result.log 2>/dev/null | cut -c1-100)"
            if [ -z "$DESCRIPTION" ]; then DESCRIPTION='Phase 4 installation failed before installer run'; fi
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context='kiosk-phase4/live-install' \
            -f description="$DESCRIPTION"
          if [ "$STATE" = failure ]; then
            if [ "${{ steps.contracts.outcome }}" = failure ]; then
              CODE='contract-test'
            elif [ "${{ steps.credentials.outcome }}" = failure ]; then
              CODE='credentials-or-health'
            else
              CAUSE="$(grep -E 'Error:|HTTP [0-9][0-9][0-9]|Missing commerce|Invalid ' phase4-result.log 2>/dev/null | tail -n 1 || true)"
              if printf '%s' "$CAUSE" | grep -qi 'Concurrent writer detected'; then
                CODE='concurrent-sql-writer'
              elif printf '%s' "$CAUSE" | grep -qi 'Invalid custom component metadata'; then
                CODE='invalid-component-schema'
              elif printf '%s' "$CAUSE" | grep -qi 'Unable to compile component'; then
                CODE='jsx-or-css-compilation'
              else
                CODE="$(printf '%s' "$CAUSE" | sed -E 's/.*(GET|POST|PUT) (\/api)?([^ ]+) HTTP ([0-9]+).*/api-\1-\3-\4/' | tr -cs 'a-zA-Z0-9_-' '-' | cut -c1-65)"
              fi
              if [ -z "$CODE" ]; then CODE='installer-error'; fi
            fi
            gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context="kiosk-phase4/failure/$CODE" \
              -f description='See the authorised live installation workflow for detailed error'
          fi
