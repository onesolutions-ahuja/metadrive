name: Full SQL-only fresh-backup and isolated restore proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-sql-isolated-proof.yml'
      - '.github/workflows/sql-only-prod-stage.yml'
      - 'apps/server/src/normalized-state-runtime.mjs'
      - 'apps/server/src/normalized-typed-records.mjs'
      - 'apps/server/src/postgres-state.ts'
      - 'apps/server/scripts/prove-typed-records-on-restore.mjs'
      - 'apps/server/src/normalized-state-tree.mjs'
      - 'apps/server/src/normalized-object-schema.mjs'
      - 'apps/server/sql/normalized-state-v3.sql'
      - 'apps/server/sql/normalized-registry-v2.sql'
      - 'apps/server/scripts/copy-typed-sql-on-restored-db.mjs'
      - 'apps/server/scripts/copy-normalized-state-on-restore.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-and-restore:
    if: github.repository == 'onesolutions-ahuja/metadrive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Aiven connection secret without printing credentials
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::METADRIVE_AIVEN_DATABASE_URL is not configured or unavailable"
            exit 1
          fi
          node --input-type=module -e "const u=new URL(process.env.DATABASE_URL); if(!['postgres:','postgresql:'].includes(u.protocol)||!u.hostname.endsWith('.aivencloud.com')||u.searchParams.get('sslmode')!=='require') throw Error('Expected Aiven PostgreSQL URL with sslmode=require'); console.log('Aiven URI format verified. Remote SQL remains read-only for this job.')"
      - name: Take full consistent PostgreSQL backup into temporary private runner storage
        env:
          DATABASE_URL: ${{ secrets.METADRIVE_AIVEN_DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const u=new URL(process.env.DATABASE_URL);
          if(!['postgres:','postgresql:'].includes(u.protocol)) throw Error('Invalid PostgreSQL URL');
          const params={
            PGHOST:u.hostname,
            PGPORT:u.port||'5432',
            PGUSER:decodeURIComponent(u.username),
            PGPASSWORD:decodeURIComponent(u.password),
            PGDATABASE:decodeURIComponent(u.pathname.slice(1)),
            PGSSLMODE:'require'
          };
          if(Object.values(params).some(v=>!v||/[\r\n]/.test(v))) throw Error('Invalid PostgreSQL connection field');
          writeFileSync(process.env.RUNNER_TEMP+'/aiven-pg.env',
            Object.entries(params).map(([k,v])=>k+'='+v).join('\n')+'\n',
            {mode:0o600,flag:'wx'});
          NODE
          docker run --rm --network host --env-file "${RUNNER_TEMP}/aiven-pg.env" \
            -v "${RUNNER_TEMP}:/work" --entrypoint pg_dump postgres:18 \
            --format=custom --no-owner --no-acl --file=/work/metadrive-private.dump
          test -s "${RUNNER_TEMP}/metadrive-private.dump"
          echo "Full Aiven database backup created without production modifications"
      - name: Restore backup into isolated PostgreSQL 18 and verify MetaDrive state
        id: restored_layout
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            --entrypoint createdb postgres:18 -h 127.0.0.1 -U postgres metadrive_restored
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "${RUNNER_TEMP}:/work" --entrypoint pg_restore postgres:18 \
            -h 127.0.0.1 -U postgres -d metadrive_restored \
            --no-owner --no-acl --exit-on-error /work/metadrive-private.dump
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored" \
            PGSSLMODE=disable METADRIVE_DIGEST_FILE="${RUNNER_TEMP}/restored.sha" \
            node apps/server/scripts/verify-aiven-state.mjs
          # Do not attempt legacy backfills when the Aiven source is already
          # SQL-only. The restored graph and physical data were just verified.
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored" PGSSLMODE=disable \
            node --input-type=module <<'NODE'
          import pg from 'pg';
          import {appendFileSync} from 'node:fs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:false});
          try {
            const r=await pool.query("SELECT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='metadrive_platform_state' AND column_name='payload') AS legacy");
            appendFileSync(process.env.GITHUB_OUTPUT,'legacy='+String(r.rows[0].legacy)+'\n');
          } finally {await pool.end();}
          NODE
          echo "Independent PostgreSQL restore verified. No backup or customer data uploaded to GitHub."
      - name: Verify complete typed business-record copy on disposable restored database
        if: steps.restored_layout.outputs.legacy == 'true'
        run: |
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored" PGSSLMODE=disable \
            node apps/server/scripts/copy-typed-sql-on-restored-db.mjs --apply
          echo "Typed SQL shadow backfill and field-by-field readback passed on isolated restore only"
      - name: Verify all Flow metadata and records as SQL typed nodes on isolated restore
        if: steps.restored_layout.outputs.legacy == 'true'
        run: |
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored" PGSSLMODE=disable \
            node apps/server/scripts/copy-normalized-state-on-restore.mjs --apply
          echo "Nested Flow/RBAC/credential state restored from SQL scalar rows, no JSONB required"
      - name: Prove ALL JSONB columns can be archived as losslessly typed SQL rows
        if: steps.restored_layout.outputs.legacy == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored
          PGSSLMODE: disable
        run: |
          node --check apps/server/scripts/archive-all-jsonb-on-restored-db.mjs
          node apps/server/scripts/archive-all-jsonb-on-restored-db.mjs --apply
          echo "No JSONB columns remain in the isolated converted database"
      - name: Test transactional typed SQL CREATE UPDATE DELETE and rollback
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored
          PGSSLMODE: disable
        run: |
          node --check apps/server/src/normalized-typed-records.mjs
          node --check apps/server/scripts/prove-typed-records-on-restore.mjs
          node apps/server/scripts/prove-typed-records-on-restore.mjs
      - name: Create separate SQL-only database snapshot on isolated runner
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "${RUNNER_TEMP}:/work" --entrypoint pg_dump postgres:18 \
            -h 127.0.0.1 -U postgres -d metadrive_restored \
            --format=custom --no-owner --no-acl --file=/work/metadrive-sql-only.dump
          test -s "${RUNNER_TEMP}/metadrive-sql-only.dump"
      - name: Independently restore SQL-only converted dump and verify typed record parity
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres --entrypoint createdb \
            postgres:18 -h 127.0.0.1 -U postgres metadrive_sql_roundtrip
          docker run --rm --network host -e PGPASSWORD=postgres \
            -v "${RUNNER_TEMP}:/work" --entrypoint pg_restore postgres:18 \
            -h 127.0.0.1 -U postgres -d metadrive_sql_roundtrip \
            --no-owner --no-acl --exit-on-error /work/metadrive-sql-only.dump
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_sql_roundtrip" PGSSLMODE=disable \
            node --input-type=module <<'NODE'
          import pg from 'pg';
          import {readNormalizedState} from './apps/server/src/normalized-state-runtime.mjs';
          import {verifyTypedRecords} from './apps/server/src/normalized-typed-records.mjs';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL,ssl:false});
          try {
            const cols=await pool.query("SELECT COUNT(*)::int AS n FROM information_schema.columns WHERE data_type IN ('json','jsonb')");
            if(cols.rows[0].n!==0) throw Error('Restored SQL-only dump recreated JSON columns');
            const state=await readNormalizedState(pool,verifyTypedRecords);
            if(!state.digest||!Object.keys(state.state.tenants||{}).length)
              throw Error('SQL-only independent restore lost tenant data');
            console.log('Independently restored SQL-only database has 0 JSONB and verified physical records');
          } finally {await pool.end();}
          NODE
      - name: Measure normalized SQL full-state read and write latency on isolated restore
        run: |
          DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/metadrive_restored" PGSSLMODE=disable \
            node apps/server/scripts/benchmark-normalized-state-on-restore.mjs
      - name: Encrypt full backup, decrypt and verify identical contents
        env:
          METADRIVE_BACKUP_ENCRYPTION_KEY: ${{ secrets.METADRIVE_BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "${METADRIVE_BACKUP_ENCRYPTION_KEY:-}" || { echo "::error::Backup encryption secret is missing"; exit 1; }
          node apps/server/scripts/secure-relational-backup.mjs encrypt \
            "${RUNNER_TEMP}/metadrive-private.dump" "${RUNNER_TEMP}/metadrive-verified.dump.enc"
          node apps/server/scripts/secure-relational-backup.mjs decrypt \
            "${RUNNER_TEMP}/metadrive-verified.dump.enc" "${RUNNER_TEMP}/verify-decrypted.dump"
          cmp "${RUNNER_TEMP}/metadrive-private.dump" "${RUNNER_TEMP}/verify-decrypted.dump"
          node apps/server/scripts/secure-relational-backup.mjs encrypt \
            "${RUNNER_TEMP}/metadrive-sql-only.dump" "${RUNNER_TEMP}/metadrive-sql-only-verified.dump.enc"
          node apps/server/scripts/secure-relational-backup.mjs decrypt \
            "${RUNNER_TEMP}/metadrive-sql-only-verified.dump.enc" "${RUNNER_TEMP}/verify-sql-only.dump"
          cmp "${RUNNER_TEMP}/metadrive-sql-only.dump" "${RUNNER_TEMP}/verify-sql-only.dump"
          echo "Full encrypted backup round-trip verified"
      - name: Retain encrypted backup for guarded production rollback
        uses: actions/upload-artifact@v4
        with:
          name: metadrive-aiven-v3-sql-shadow-verified-encrypted-backup
          path: |
            ${{ runner.temp }}/metadrive-verified.dump.enc
            ${{ runner.temp }}/metadrive-sql-only-verified.dump.enc
            ${{ runner.temp }}/restored.sha
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Delete transient database backup and credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/aiven-pg.env" "${RUNNER_TEMP}/metadrive-private.dump" "${RUNNER_TEMP}/verify-decrypted.dump" "${RUNNER_TEMP}/metadrive-verified.dump.enc" "${RUNNER_TEMP}/metadrive-sql-only.dump" "${RUNNER_TEMP}/metadrive-sql-only-verified.dump.enc" "${RUNNER_TEMP}/verify-sql-only.dump"
