name: Scheduler PostgreSQL concurrency proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/scheduler-postgres-proof.yml'
      - 'apps/server/test/scheduler-postgres-lease.integration.test.ts'
      - 'apps/server/src/postgres-state.ts'
      - 'apps/server/src/core/state/**'
      - 'apps/server/package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Exercise actual PostgreSQL scheduler lock contention
        env:
          METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:scheduler-postgres --prefix apps/server
