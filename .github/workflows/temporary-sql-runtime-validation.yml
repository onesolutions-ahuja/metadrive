name: Temporary SQL runtime validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [architecture/fresh-sql-system-files-20261017]
permissions:
  contents: read
jobs:
  sql-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Detect missing source references
        run: node scripts/verify-project-references.mjs
      - name: Compile full web and new SQL backend
        run: npm run build
      - name: SQL security and runtime tests
        run: npm run test:unit
      - name: Check published web assets
        run: node scripts/verify-pages-artifacts.mjs
      - name: Verify startup fails closed without database
        run: |
          set +e
          env -u DATABASE_URL node apps/server/dist-system/system-files/entrypoint.js >startup.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q "DATABASE_URL is required" startup.log
