name: POS safety metadata (one-time verified)
on:
  push:
    branches: [feature/pos-live-checkout-implementation]
    paths:
      - '.github/workflows/pos-safety-install-once.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cash age and stock object metadata
        run: node --test tests/current/pos-checkout-safety-flow.test.mjs
      - name: Install additive tenant POS safety metadata (checkout remains Draft)
        env:
          METADRIVE_API_URL: https://metadrive-production.up.railway.app
          METADRIVE_ADMIN_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_ADMIN_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
          METADRIVE_EXPECTED_TENANT_ID: unesolutions-dev
          METADRIVE_POS_SAFETY_INSTALL_APPROVED: 'true'
        run: node scripts/pos-checkout-safety-install.mjs
