name: Deploy MetaDrive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: metadrive-pages
  # Never interrupt an in-progress Pages asset publication. Old tabs handle
  # the transition via guarded lazy-chunk refresh rather than broken routes.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build MetaDrive frontend
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
          VITE_API_BASE_URL: https://metadrive-production.up.railway.app/api
        run: npm run build --workspace apps/web
      - name: Verify built Pages UI and branding
        run: node scripts/verify-pages-artifacts.mjs
      - name: Verify client-side deep-link fallback
        run: test -f apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages matches this release
        run: node scripts/verify-pages-artifacts.mjs --live
