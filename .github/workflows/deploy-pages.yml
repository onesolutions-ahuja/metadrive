name: Deploy MetaDrive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: metadrive-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build MetaDrive frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://oneengine-6gas.onrender.com/api
        run: npm run build --workspace apps/web
      - name: Verify client-side deep-link fallback
        run: test -f apps/web/dist/404.html
      - name: Ensure GitHub Pages uses Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "/repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
