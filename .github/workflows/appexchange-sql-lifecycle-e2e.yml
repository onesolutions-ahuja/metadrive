name: AppExchange SQL lifecycle E2E
on:
  pull_request:
    paths:
      - '.github/workflows/appexchange-sql-lifecycle-e2e.yml'
      - 'scripts/appexchange-sql-lifecycle.check.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appexchange_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/appexchange_e2e
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify SQL test database
        run: node scripts/appexchange-sql-lifecycle.check.mjs
      - name: Exercise lifecycle over API using SQL
        run: npx tsx --test --test-concurrency=1 apps/server/test/connector-app-phase1.smoke.test.ts
