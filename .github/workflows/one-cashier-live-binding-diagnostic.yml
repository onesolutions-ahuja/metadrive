name: Cashier draft live read-only binding diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/one-cashier-live-binding-diagnostic.mjs
      - .github/workflows/one-cashier-live-binding-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live cashier draft without data modification
        env:
          METADRIVE_API_BASE: https://metadrive-production.up.railway.app
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/one-cashier-live-binding-diagnostic.mjs
