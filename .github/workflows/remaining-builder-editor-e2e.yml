name: Remaining Builder Editor E2E
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/existing-builders-browser-e2e.mjs'
      - 'scripts/pos-cashier-paired-browser-smoke.mjs'
      - '.github/workflows/remaining-builder-editor-e2e.yml'
      - 'apps/web/src/**'
      - 'apps/server/src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editors:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Isolated cashier and customer display age/cash state acceptance
        run: node scripts/pos-cashier-paired-browser-smoke.mjs
      - name: Authenticated Flow Dashboard Report Builder save and reopen; published runtimes
        run: node scripts/existing-builders-browser-e2e.mjs
