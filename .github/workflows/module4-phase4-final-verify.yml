name: Validate Final Module 4 Phase 4
on:
  push:
    branches: [feature/module4-phase4-final-reconciled-20261012]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'automated phase4 settings UI integration')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/module4-phase4-final-reconciled-20261012
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Integrate phase 4 settings into current App.tsx
        run: node apps/server/scripts/phase4-ui-source-patch.mjs
      - name: Compile frontend and server
        run: npm run build
      - name: Execute full backend security regression suite
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: npm run test --workspace apps/server
      - name: Commit validated integration
        run: |
          if git diff --quiet -- apps/server/src/index.ts apps/web/src/App.tsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/index.ts apps/web/src/App.tsx
          git commit -m "automated phase4 settings UI integration"
          git push origin HEAD:feature/module4-phase4-final-reconciled-20261012
