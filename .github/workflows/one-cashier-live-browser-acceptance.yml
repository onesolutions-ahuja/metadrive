name: Authenticated cashier draft live browser acceptance
on:
  push:
    branches: [main]
    paths:
      - scripts/one-cashier-live-browser-acceptance.mjs
      - .github/workflows/one-cashier-live-browser-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-browser-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the matching GitHub Pages frontend
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
          VITE_API_BASE_URL: https://metadrive-production.up.railway.app/api
        run: npm run build --workspace apps/web
      - name: Confirm branded site serves the exact merged build
        run: node scripts/verify-pages-release.mjs --live
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify saved cashier draft using live Product records; do not save, activate or checkout
        env:
          METADRIVE_API_BASE: https://metadrive-production.up.railway.app
          METADRIVE_WEB_BASE: https://unesolutions.co.uk
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/one-cashier-live-browser-acceptance.mjs
