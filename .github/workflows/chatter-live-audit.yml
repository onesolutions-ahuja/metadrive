name: Chatter production metadata audit
on:
  push:
    branches: [feature/chatter-secure-completion-20261015]
    paths:
      - scripts/chatter-live-audit.mjs
      - .github/workflows/chatter-live-audit.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live metadata without modifying production
        env:
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/chatter-live-audit.mjs
