name: MetaDrive Pages Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# A newer release must supersede a stale, queued Pages deployment instead of
# leaving the latest production frontend blocked behind obsolete commits.
concurrency:
  # Keep PR checks separate from production so a feature push cannot cancel a live release.
  group: metadrive-pages-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Production Pages is a frontend release: do not block it behind unrelated
      # server/metadata suites. Run shared full checks on pull requests.
      - name: Verify standalone login, frontend routing and product screens
        run: npm run test:login && npm run build --workspace apps/web
      - name: Run comprehensive repository checks for pull requests
        if: github.event_name == 'pull_request'
        run: npm run check
      - name: Verify current production frontend API and browser login
        if: github.event_name == 'pull_request'
        run: node scripts/verify-public-render-routing.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build branded frontend with verified Oracle API destination
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
          VITE_API_BASE_URL: https://api.unesolutions.co.uk/api
        run: npm run build --workspace apps/web
      - run: node scripts/verify-pages-artifacts.mjs
      - name: Verify Oracle API health and credentialed browser CORS
        env:
          METADRIVE_API_BASE_URL: https://api.unesolutions.co.uk/api
        run: node scripts/verify-render-api.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Verify the exact frontend release has propagated before checking its API binding.
      - name: Verify published site serves this exact frontend bundle
        run: node scripts/verify-pages-artifacts.mjs --live
      - name: Verify published frontend binds to Oracle API and login CORS
        env:
          METADRIVE_API_BASE_URL: https://api.unesolutions.co.uk/api
        run: node scripts/verify-public-render-routing.mjs
