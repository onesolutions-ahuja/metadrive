name: MetaDrive Pages Release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: metadrive-pages-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify production frontend, Render API and browser login
        if: github.event_name == 'pull_request'
        run: node scripts/verify-public-render-routing.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build branded frontend with verified API destination
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
          VITE_API_BASE_URL: https://metadrive-nxd7.onrender.com/api
        run: npm run build --workspace apps/web
      - run: node scripts/verify-pages-artifacts.mjs
      - name: Verify Render SQL API and browser origin before publishing
        run: node scripts/verify-render-api.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Release the current main frontend, including metadata integrity diagnostics.
      - name: Verify published site serves this exact frontend bundle
        run: node scripts/verify-pages-artifacts.mjs --live
  publication-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/offline-publication-20261021'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authenticated metadata publication digest and freshness
        run: node scripts/diagnose-offline-publication.mjs
        env:
          METADRIVE_TENANT_SLUG: ${{ secrets.METADRIVE_TENANT_SLUG }}
          METADRIVE_LOGIN_EMAIL: ${{ secrets.METADRIVE_LOGIN_EMAIL }}
          METADRIVE_LOGIN_PASSWORD: ${{ secrets.METADRIVE_LOGIN_PASSWORD }}
