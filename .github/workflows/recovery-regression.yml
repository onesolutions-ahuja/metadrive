name: Recovery security regression
on:
  push:
    branches: [feature/tenant-recovery-flow-platform-20261013]
  pull_request:
    paths:
      - 'apps/server/src/recovery-policy.ts'
      - 'apps/server/test/recovery-policy.test.ts'
      - 'apps/server/test/module4-password-recovery.smoke.test.ts'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/server
      - run: npx tsx --test apps/server/test/recovery-policy.test.ts apps/server/test/module4-password-recovery.smoke.test.ts
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
