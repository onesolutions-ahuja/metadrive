name: SQL System Validation
on:
  push:
    branches:
      - feature/fresh-core-22-objects-20261018
    paths:
      - 'apps/server/src/system-files/**'
      - 'apps/server/test/system/**'
      - 'apps/server/package.json'
      - 'apps/web/src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/system-validation.yml'
  pull_request:
    paths:
      - 'apps/server/src/system-files/**'
      - 'apps/server/test/system/**'
      - 'scripts/**'
      - 'apps/server/package.json'
      - 'apps/web/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/system-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: metadrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metadrive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node apps/server/src/system-files/sql-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
