name: SQL System Validation
on:
  pull_request:
    paths:
      - 'apps/server/src/system-files/**'
      - 'apps/server/src/system-support/**'
      - 'apps/server/test/**'
      - 'apps/server/scripts/**'
      - 'apps/server/package.json'
      - 'apps/web/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/system-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: postgres
          POSTGRES_DB: metadrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metadrive_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require zero unmatched SQL API paths
        run: npm run audit:sql-routes
      - run: npm run check
      - name: Existing SQL schema migration upgrade regression
        run: node apps/server/scripts/legacy-migration-upgrade-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - run: node apps/server/scripts/sql-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: PostgreSQL durable-job recovery and concurrency
        run: node apps/server/scripts/durable-job-sql-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: Complete RBAC SQL and HTTP validation
        run: node apps/server/scripts/rbac-sql-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - run: node apps/server/scripts/dynamic-http-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: SQL HTTP authentication and permission denial regression
        run: node apps/server/scripts/security-negative-http-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: Isolated PostgreSQL logical backup and restore rehearsal
        run: node apps/server/scripts/sql-restore-rehearsal.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: Install Chromium browser for SQL Builder E2E
        run: npm install --no-save --package-lock=false playwright && npx playwright install --with-deps chromium
      - name: Real-browser Flow Builder and Screen Flow SQL smoke
        run: node apps/server/scripts/builder-browser-smoke.mjs
        env:
          METADRIVE_SQL_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/metadrive_test
      - name: Preserve Page and Flow Builder browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-builder-browser-evidence
          path: apps/server/artifacts/*.png
          if-no-files-found: ignore
