name: Oracle Mail Runtime Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-production-api
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Diagnose running Stalwart transport (no secret logging)
        run: |
          python3 -m py_compile scripts/oracle/check-mail-runtime.py
          sudo --non-interactive /usr/bin/python3 -I -S scripts/oracle/check-mail-runtime.py

      - name: Check inbound SMTP and outgoing delivery prerequisites (read-only)
        run: |
          python3 -m py_compile scripts/oracle/mail_relay_probe.py
          python3 -m py_compile scripts/oracle/check-mail-delivery.py
          python3 -m unittest scripts/oracle/test_mail_relay_probe.py
          sudo --non-interactive /usr/bin/python3 -I -S scripts/oracle/check-mail-delivery.py

  public-mail-probe:
    if: github.ref == 'refs/heads/main'
    needs: diagnose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test public DNS, SMTP TLS, submission and IMAPS from outside Oracle
        run: |
          python3 -m unittest scripts/oracle/test_check_mail_public.py
          python3 scripts/oracle/check-mail-public.py \
            --host mail.unesolutions.co.uk \
            --expected-address 132.145.18.46
