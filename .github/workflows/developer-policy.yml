name: Developer Policy and Architecture
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Enforce developer policy
        env:
          POLICY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-developer-policy.mjs
      - name: Read-only architecture inventory
        run: node scripts/audit-platform-architecture.mjs --output .artifacts/architecture-inventory.json
      - name: Read-only component inventory
        run: node scripts/audit-component-registry.mjs --output .artifacts/component-registry-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: current-platform-architecture
          path: .artifacts/
          retention-days: 7
