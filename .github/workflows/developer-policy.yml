name: Developer Policy and Architecture Inventory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  code-file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce changed code file limit
        env:
          POLICY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-developer-policy.mjs
      - name: Test read-only architecture inventory
        run: node --test scripts/audit-platform-architecture.test.mjs
      - name: Test registered component coverage
        run: node --test scripts/audit-component-registry.test.mjs
      - name: Test shared SQL component property guards
        run: node --test scripts/component-property-sql-guard.test.mjs
      - name: Generate architecture inventory
        run: node scripts/audit-platform-architecture.mjs --output .artifacts/architecture-inventory.json
      - name: Generate component registry and reuse inventory
        run: node scripts/audit-component-registry.mjs --output .artifacts/component-registry-inventory.json
      - name: Attach safe architecture inventory
        uses: actions/upload-artifact@v4
        with:
          name: metadrive-architecture-inventory
          path: |
            .artifacts/architecture-inventory.json
            .artifacts/component-registry-inventory.json
          retention-days: 7
