name: Developer Policy and SQL Architecture
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reject missing source modules and deleted script dependencies
        run: node scripts/verify-project-references.mjs
      - name: Compile fresh SQL runtime
        run: npm run build:system --workspace apps/server
      - name: Enforce actual SQL authentication and permission tests
        run: npm run test:system --workspace apps/server
      - name: Reject old JSON state and seed imports from system services
        run: |
          if grep -nRE 'platform-state\\.json|platform-metadata\\.json|local-platform-seed|seeders/|core/state/|readFileSync|JSONB' apps/server/src/system-files/*.ts; then
            echo "SQL architecture violation"
            exit 1
          fi
