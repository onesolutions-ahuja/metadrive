name: MD-08 App Manager and Navigation
on:
  pull_request:
    paths:
      - 'apps/web/src/AppManager.tsx'
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/appNavigation.ts'
      - 'apps/web/src/styles.css'
      - 'apps/web/test/appNavigation.test.mjs'
      - '.github/workflows/md08-app-manager-navigation.yml'
  workflow_dispatch:

# Superseded PR commits should not consume runner minutes; distinct workflows
# retain their own required checks. Main branch validations are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: App navigation unit tests
        run: node --experimental-strip-types --test apps/web/test/appNavigation.test.mjs
      - name: Compile frontend and verify production bundle
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: '/'
        run: npm run build --workspace apps/web
      - name: Verify GitHub Pages navigation and branding
        run: node scripts/verify-pages-release.mjs
      - name: Build API and verify runtime dependencies
        run: npm run build --workspace apps/server
      # Tenant RBAC server regression is gated by Validate MetaDrive deployment.
