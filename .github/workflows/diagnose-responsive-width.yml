name: Temporary authenticated width diagnostic
on:
  push:
    branches: [audit/diagnose-width-20261012]
    paths: [scripts/verify-ux-fixes.mjs, .github/workflows/diagnose-responsive-width.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --no-package-lock playwright@1.56.0 @axe-core/playwright@4.11.0
      - run: npx playwright install --with-deps chromium
      - name: Report layout metrics without record contents
        env:
          METADRIVE_TEST_EMAIL: ${{ secrets.METADRIVE_TEST_EMAIL }}
          METADRIVE_TEST_PASSWORD: ${{ secrets.METADRIVE_TEST_PASSWORD }}
        run: node scripts/verify-ux-fixes.mjs
