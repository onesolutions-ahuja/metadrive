name: Fresh SQL System Services
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile new SQL services (without legacy files)
        run: npm run build:system --workspace apps/server
      - name: Execute fail-closed SQL service tests
        run: npm run test:system --workspace apps/server
      - name: Assert standalone server output
        run: test -f apps/server/dist-system/system-files/entrypoint.js
      - name: Prevent legacy storage references in new services
        run: |
          if grep -nRE 'platform-state\.json|platform-metadata\.json|local-platform-seed|seeders/|core/state/|readFileSync|JSONB' apps/server/src/system-files/*.ts; then
            echo 'Legacy runtime dependency found'
            exit 1
          fi
          echo 'New SQL services do not depend on deleted state or seeders'
