name: MD-09 Conditional Visibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/App.tsx'
      - 'apps/web/src/ComponentVisibilityEditor.tsx'
      - 'apps/web/src/componentVisibility.ts'
      - 'scripts/md09-component-visibility.test.mjs'
      - 'scripts/md09-component-visibility-browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/md09-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visibility-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Visibility metadata unit tests
        run: npm run test:visibility
      - name: Build full production platform
        run: npm run build
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test Page Builder, runtime visibility and record fields
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: node scripts/md09-component-visibility-browser-smoke.mjs
