name: Validate tenant metadata name binding
on:
  push:
    branches: [feature/tenant-recovery-flow-platform-20261013]
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-recovery-tenant-name.mjs
      - run: npm run build --workspace apps/server
      - run: npx tsx --test apps/server/test/recovery-policy.test.ts apps/server/test/module4-password-recovery.smoke.test.ts
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
      - name: Commit validated registry binding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/index.ts
          git rm scripts/fix-recovery-tenant-name.mjs .github/workflows/fix-recovery-tenant-name.yml
          git commit -m "fix(recovery): resolve Tenant.Name using trusted tenant registry"
          git push origin HEAD:feature/tenant-recovery-flow-platform-20261013
