name: Oracle SQL API Deployment
on:
  # Backend changes now deploy to Oracle from main, subject to the existing
  # oracle-production environment protection/approval.
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'apps/connectors/**'
      - 'scripts/oracle/deploy-api.sh'
      - 'scripts/oracle/diagnose-api-startup.py'
      - 'scripts/oracle/repair-oauth-function-owner.py'
      - 'scripts/oracle/install-mcp-operations.sh'
      - 'scripts/oracle/metadrive-mcp-operations'
      - 'scripts/oracle/metadrive-mcp-activate'
      - 'scripts/oracle/install-mcp-broker.sh'
      - 'scripts/oracle/metadrive-mcp-broker.py'
      - '.github/workflows/oracle-api-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: oracle-production-api
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, metadrive-oracle]
    environment: oracle-production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace apps/server
      - name: Verify both runtime builds and rollback script
        run: |
          test -f apps/server/dist-system/system-support/entrypoint.js
          test -f apps/server/dist-system/system-support/job-worker-entrypoint.js
          grep -q registerStalwartMailRoutes apps/server/dist-system/system-support/server.js
          bash -n scripts/oracle/deploy-api.sh
          python3 -m py_compile scripts/oracle/diagnose-api-startup.py
          python3 -m py_compile scripts/oracle/repair-oauth-function-owner.py
          bash -n scripts/oracle/check-communication-backlog.sh
      - name: Align existing OAuth function owner for SQL migration
        run: sudo --non-interactive /usr/bin/python3 -I scripts/oracle/repair-oauth-function-owner.py
      - name: Deploy immutable API and worker release with rollback
        id: deploy
        run: sudo --non-interactive bash scripts/oracle/deploy-api.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
      - name: Install restricted MCP operations from trusted checkout
        id: mcp_install
        run: |
          bash -n scripts/oracle/install-mcp-broker.sh
          python3 -m py_compile scripts/oracle/metadrive-mcp-broker.py
          sudo --non-interactive bash scripts/oracle/install-mcp-broker.sh
          test "$(systemctl show metadrive-api.service -p NoNewPrivileges --value)" = yes
          systemctl is-active --quiet metadrive-mcp-broker.socket
          sudo --non-interactive systemctl restart metadrive-api.service
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 4 https://api.unesolutions.co.uk/.well-known/oauth-protected-resource/api/mcp > /tmp/metadrive-mcp-discovery-${GITHUB_RUN_ID}.json; then
              if node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1]));if(x.resource!=="https://api.unesolutions.co.uk/api/mcp")process.exit(1)' "/tmp/metadrive-mcp-discovery-${GITHUB_RUN_ID}.json"; then
                rm -f "/tmp/metadrive-mcp-discovery-${GITHUB_RUN_ID}.json"
                exit 0
              fi
            fi
            sleep 2
          done
          rm -f "/tmp/metadrive-mcp-discovery-${GITHUB_RUN_ID}.json"
          echo "MCP resource metadata did not pass HTTPS verification" >&2
          exit 1
      - name: Verify live SQL Communication deliveries
        id: communication_check
        run: sudo --non-interactive bash scripts/oracle/check-communication-backlog.sh "$GITHUB_OUTPUT"
      - name: Publish verifiable Oracle production result to the deployed commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployed = '${{ steps.deploy.outcome }}' === 'success';
            const mcpInstalled = '${{ steps.mcp_install.outcome }}' === 'success';
            const sqlChecked = '${{ steps.communication_check.outcome }}' === 'success';
            const pending = '${{ steps.communication_check.outputs.pending_count }}' || 'unknown';
            const count = '${{ steps.communication_check.outputs.record_count }}' || 'unknown';
            const verified = deployed && mcpInstalled && sqlChecked;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: verified ? 'success' : 'failure',
              context: 'oracle-production/communication',
              description: (verified
                ? 'API+worker active; Communication records '+count+'; pending 0'
                : 'API/worker or Communication backlog check failed; pending '+pending).slice(0,140),
              target_url: context.serverUrl+'/'+context.repo.owner+'/'+
                context.repo.repo+'/actions/runs/'+context.runId
            });
