name: One Components cashier draft preview browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/src/custom-components/one/**
      - apps/web/src/MetadataBoundPageComponent.tsx
      - apps/web/src/pageBuilderView.tsx
      - scripts/one-cashier-preview-browser-smoke.mjs
      - .github/workflows/one-cashier-preview-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cashier-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify local-only component interactions without business writes
        run: node scripts/one-cashier-preview-browser-smoke.mjs
