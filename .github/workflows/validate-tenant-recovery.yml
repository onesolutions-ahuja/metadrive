name: Validate tenant recovery policy implementation
on:
  push:
    branches: [feature/tenant-recovery-flow-platform-20261013]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply targeted recovery patches
        run: |
          node scripts/apply-recovery-flow-phase.mjs
          node scripts/apply-recovery-ui.mjs
          node scripts/apply-recovery-tests.mjs
      - name: Compile application
        run: npm run build --workspace apps/server
      - name: Test policy and existing password recovery security
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: |
          npx tsx --test apps/server/test/recovery-policy.test.ts
          npx tsx --test apps/server/test/module4-password-recovery.smoke.test.ts
      - name: Commit only validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/index.ts apps/web/src/App.tsx apps/server/test/module4-password-recovery.smoke.test.ts
          git rm scripts/apply-recovery-flow-phase.mjs scripts/apply-recovery-ui.mjs scripts/apply-recovery-tests.mjs .github/workflows/validate-tenant-recovery.yml
          git commit -m "feat(recovery): configure tenant recovery method, templates and SMTP fallback"
          git push origin HEAD:feature/tenant-recovery-flow-platform-20261013
