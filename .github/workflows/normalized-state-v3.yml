name: Validate lossless SQL normalization v3
on:
  push:
    branches: [migration/normalized-v3-all-state-20261011, migration/sql-only-shadow-proof-20261011]
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/normalized-state-*.mjs'
      - 'apps/server/sql/normalized-state-v3.sql'
      - 'apps/server/test/normalized-state-*.mjs'
      - 'apps/server/scripts/copy-normalized-state-on-restore.mjs'
      - 'apps/server/src/postgres-state.ts'
      - 'apps/server/src/core/state/**'
      - 'apps/server/src/normalized-object-schema.mjs'
      - 'apps/server/src/normalized-typed-records.mjs'
      - 'apps/server/test/normalized-typed-field-widen.integration.test.mjs'
      - 'apps/server/scripts/copy-runtime-assets.mjs'
      - 'apps/server/test/normalized-api.integration.test.mjs'
      - '.github/workflows/normalized-state-v3.yml'
  workflow_dispatch:

# Superseded PR commits should not consume runner minutes; distinct workflows
# retain their own required checks. Main branch validations are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  normalized-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      METADRIVE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify entire nested state codec and PostgreSQL concurrency/rollback
        run: node --test --test-concurrency=1 apps/server/test/normalized-state-tree.test.mjs apps/server/test/normalized-state-runtime.integration.test.mjs
      - name: Verify original application build
        run: npm run build
      - name: Verify safe typed field widening and no-loss rollback
        run: node --test apps/server/test/normalized-object-schema.test.mjs apps/server/test/normalized-typed-field-widen.integration.test.mjs
      - name: End-to-end SQL-only login, CRUD, Flow execution and restart
        run: node --test --test-concurrency=1 apps/server/test/normalized-api.integration.test.mjs
      # Flow, named-credential and RBAC regressions are in deployment validation.
