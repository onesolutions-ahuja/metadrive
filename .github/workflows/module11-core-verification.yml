name: Module 11 core integration verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/src/connector-*.ts'
      - 'apps/server/src/outbound-callout-policy.ts'
      - 'apps/server/test/connector-*.ts'
      - 'apps/server/test/connector-*.mjs'
      - 'apps/server/sql/module11-*.sql'
      - '.github/workflows/module11-core-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: md11test
          POSTGRES_PASSWORD: md11test
          POSTGRES_DB: md11test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U md11test -d md11test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile MetaDrive client and server
        run: npm run build
      - name: Unit, security, credential masking and integration regression
        env:
          NODE_ENV: test
          METADRIVE_TEST_MODE: 'true'
        run: >-
          npx tsx --test --test-concurrency=1
          apps/server/test/connector-integrations.test.ts
          apps/server/test/connector-oauth.test.ts
          apps/server/test/connector-oauth-challenges.test.ts
          apps/server/test/connector-outbox.test.ts
          apps/server/test/connector-reliability.test.ts
          apps/server/test/connector-envelope.test.ts
          apps/server/test/connector-delivery-worker.test.ts
          apps/server/test/outbound-callout-policy.test.ts
          apps/server/test/connector-test.test.ts
      - name: Persistent SQL OAuth state and durable outbox integration
        env:
          METADRIVE_TEST_DATABASE_URL: postgres://md11test:md11test@localhost:5432/md11test
          NODE_ENV: test
        run: >-
          node --test
          apps/server/test/connector-outbox.postgres.integration.test.mjs
          apps/server/test/connector-oauth.postgres.integration.test.mjs
